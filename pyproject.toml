[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owasp-top10-defense"
version = "1.0.0"
description = "OWASP Top 10:2021 로컬 방어 실습. 취약 엔드포인트와 수정 엔드포인트를 나란히 둔다."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask==3.1.3",
    "argon2-cffi==25.1.0",
]

[project.scripts]
owasp-check = "owasp_check.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "owasp_check*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --color=no"
